<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP GrokBot</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a09; color: #f4f4f0; }
    main { max-width: 36rem; padding: 2rem; }
    code { background: #1c1c1a; padding: .1rem .35rem; border-radius: .4rem; }
    a { color: #a9d4ff; }
  </style>
</head>
<body>
  <main>
    <h1>SAP GrokBot</h1>
    <p>
      Die Oberfläche nutzt jetzt die Bops-Chat-UI unter der Next.js-Route
      <a href="/sap"><code>/sap</code></a>.
    </p>
    <p>Lokal starten: <code>npm run sap:demo</code>, dann
      <a href="http://127.0.0.1:3211/sap">http://127.0.0.1:3211/sap</a> öffnen.</p>
    <p>Der API-Server (<code>npm run sap:demo:api</code>) bleibt für Cloud-Workspaces und Tests verfügbar.</p>
  </main>
</body>
</html>
