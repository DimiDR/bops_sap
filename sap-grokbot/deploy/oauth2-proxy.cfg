provider = "oidc"
http_address = "127.0.0.1:4180"
upstreams = ["static://202"]
reverse_proxy = true
set_xauthrequest = true
skip_provider_button = true
code_challenge_method = "S256"
cookie_name = "__Host-grokbot"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "1h"
request_logging = false
email_domains = ["*"]
# Supply the tenant issuer, client ID, client secret, cookie secret, redirect URL
# and allowed group via the environment. See the deployment instructions.
